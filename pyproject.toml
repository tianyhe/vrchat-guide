[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "build>=1.2.2.post1",
    "jupyter>=1.1.1",
    "black>=23.0.0",
    "pytest>=7.0.0",
    "pylint>=2.17.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/vrchat_guide"]
[tool.hatch.build]
inclued = ["src/worksheets"]

[tool.uv.sources]
genie-worksheets = { path = "packages/genie-worksheets", editable = true }
# Commented out to use local version with edits
# 1. Uncomment the line below to use the local suql package
# suql = { path = "packages/suql", editable = true }
# 2. Uninstall PyPI suql if already installed
# 3. 'uv pip install -e packages/suql' to install the local version in editable mode
