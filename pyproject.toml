[project]
name = "vrchat-guide"
version = "0.2.0"
description = "Intelligent VRChat Guide using Genie Worksheets framework"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }

# Core dependencies with version constraints
dependencies = [
    "pip>=24.3.1",
    "google_auth_oauthlib>=1.2.1",
    # "pydantic>=1.7.4",

    # Genie Worksheets Core Dependencies
    "google-api-python-client>=2.149.0",
    "google-auth>=2.35.0",
    "json-repair>=0.30.0",
    "loguru>=0.7.2",
    "pandas>=2.2.3",
    "termcolor>=2.5.0",
    "toml>=0.10.2",
    "sql-metadata>=2.13.0",
    "grandalf>=0.8",
    "langchain-openai>=0.1.7",
    "langgraph >= 0.6.0",
    "langchain-together>=0.1.1",
    # "PyYAML>=6.0.1",

    # SUQL Core Dependencies
    "suql>=1.1.8",
    "Jinja2==3.1.2",
    "Flask==2.3.2",
    "Flask-Cors==4.0.0",
    "Flask-RESTful==0.3.10",
    "requests>=2.31.0",
    "tiktoken>=0.4.0",
    "pglast>=6.10",
    "litellm>=1.34.34",
    "platformdirs>=4.0.0",
    "sqlparse~=0.5.0",
    "sympy>=1.14.0",
    "psycopg2-binary>=2.9.10",
    "psycopg2>=2.9.10",
    "faiss-cpu>=1.7.4",        # or faiss-gpu for GPU support
    "spacy>=3.5.0",
    "FlagEmbedding~=1.2.5",
    "torch~=2.2.2",
    "numpy<2.0.0",
    "peft==0.17.1",

    # Web Integration Core Dependencies
    "chainlit>=2.0.0",
    "beautifulsoup4>=4.13.4",
    "rich>=14.0.0",
    "redis >= 6.4.0",
]


